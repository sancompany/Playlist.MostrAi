name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

# Um build por ramo de cada vez: o push novo cancela o anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-e-testes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # Histórico inteiro: a varredura de segredos olha também os commits antigos.
          fetch-depth: 0

      # JDK 21: o Robolectric 4.16 roda o SDK 36 só em JDK 21+. O bytecode
      # continua JVM 17 (app/build.gradle.kts).
      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache do Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Varredura de segredos
        run: scripts/varrer-segredos.sh

      - name: Build debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Conferência do APK debug (SDK, permissões, manifesto)
        run: scripts/verificar-apk.sh app/build/outputs/apk/debug/app-debug.apk

      # Sem keystore no CI (a chave definitiva nunca sai da máquina do dono):
      # o release sai sem assinatura e o registro diz "NÃO É PRODUÇÃO".
      - name: Build release + registro do candidato
        run: scripts/release-candidato.sh

      - name: Lint (debug e release)
        run: ./gradlew lintDebug lintRelease --no-daemon

      - name: Testes unitários (Robolectric; RetornoPorApiTest roda em API 26, 29, 31, 34 e 36)
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Publicar resultado dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-teste
          path: app/build/test-results/testDebugUnitTest/
          retention-days: 7

      - name: Publicar relatórios de lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint
          path: app/build/reports/lint-results-*.html
          retention-days: 7

      - name: Publicar candidato a release (sem assinatura) e registro
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: release-candidato-nao-assinado
          path: app/build/release-candidato/
          retention-days: 14
